
name: Build VW Polo Companion APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VWPoloCompanion-Android-Source.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract source project
        run: unzip -q VWPoloCompanion-Android-Source.zip

      - name: Compile debug APK
        run: gradle -p VWPoloCompanion assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VW-Polo-Companion-APK
          path: VWPoloCompanion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
